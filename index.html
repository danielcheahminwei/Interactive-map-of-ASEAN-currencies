<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASEAN Currency Flight Academy</title>
    <style>
        :root {
            --primary-blue: #003366;
            --accent-red: #be123c;
            --ocean-blue: #bae6fd;
            --dark-slate: #1e293b;
            
            /* Bright, child-friendly colors for distinct country separation */
            --color-myanmar: #f59e0b;
            --color-thailand: #ef4444;
            --color-laos: #3b82f6;
            --color-cambodia: #10b981;
            --color-vietnam: #8b5cf6;
            --color-malaysia: #ec4899;
            --color-singapore: #f43f5e;
            --color-brunei: #facc15;
            --color-indonesia: #14b8a6;
            --color-philippines: #f97316;
            --color-timor: #6366f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            background-color: var(--primary-blue);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 1050px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .airport-status {
            background-color: #111;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 20px;
            width: 100%;
            max-width: 1050px;
        }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .panel h2 {
            margin-top: 0;
            color: var(--primary-blue);
            font-size: 1.3rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        /* Interactive Map Frame Layout */
        .map-container {
            background-color: var(--ocean-blue);
            border: 2px solid #7dd3fc;
            border-radius: 8px;
            padding: 10px;
            position: relative;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            max-height: 480px;
        }

        /* Base SVG Path Properties */
        .country-path {
            stroke: #ffffff;
            stroke-width: 1.5;
            cursor: pointer;
            transition: filter 0.2s, transform 0.2s, stroke 0.2s;
        }

        /* Interactive hover state highlights individual map chunks */
        .country-path:hover {
            filter: brightness(1.2) drop-shadow(0px 4px 8px rgba(0,0,0,0.3));
            stroke: #1e293b;
            stroke-width: 2;
        }

        .country-path.active {
            filter: brightness(0.8) saturate(1.5) !important;
            stroke: #000000 !important;
            stroke-width: 2.5;
        }

        /* Dialogue Box Style */
        .map-tooltip {
            position: absolute;
            background: rgba(30, 41, 59, 0.95);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
            font-weight: bold;
            white-space: nowrap;
        }

        .map-tooltip::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: rgba(30, 41, 59, 0.95) transparent;
        }

        /* Math Workspace Elements */
        .workspace {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 20px;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .workspace.active-game {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            display: block;
            text-align: left;
        }

        /* Cash Visual Items Layout */
        .cash-flex-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0 25px 0;
        }

        .cash-item {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            cursor: pointer;
            user-select: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cash-item:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
            z-index: 5;
        }

        .cash-item.spin-animation {
            transform: scale(1.2) rotateY(360deg);
        }

        .paper-note {
            width: 85px;
            height: 45px;
            border-radius: 4px;
            color: white;
            border: 1px dashed rgba(255,255,255,0.5);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .metal-coin {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            color: #854d0e;
            border: 2px solid #facc15;
        }

        .input-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="number"] {
            width: 85px;
            padding: 10px;
            font-size: 18px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            text-align: center;
        }

        .btn {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-blue { background-color: #0284c7; }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 15px;
            padding: 10px;
            border-radius: 6px;
        }
        .success { background-color: #d1fae5; color: #065f46; }
        .error { background-color: #fee2e2; color: #991b1b; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>🌏 ASEAN Currency Flight Academy</h1>
        <div class="airport-status" id="flight-status">
            📍 DEPARTURE TERMINAL: MALAYSIA // MOVE YOUR CURSOR OR CLICK A COUNTRY TO BEGIN
        </div>
    </header>

    <div class="main-layout">
        
        <div class="panel">
            <h2>Colourful 2D Map of Southeast Asian Nations (11 Member States)</h2>
            <div class="map-container" id="map-frame">
                
                <div id="tooltip" class="map-tooltip"></div>

                <svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
                    
                    <path id="MM" data-name="Myanmar" data-flag="🇲🇲" data-symbol="K (Kyat)" class="country-path" style="fill: var(--color-myanmar);" d="M 120 40 L 170 60 L 190 120 L 210 140 L 220 220 L 195 240 L 190 180 L 160 160 L 150 100 L 100 90 Z" onclick="launchGame('MM')"/>
                    
                    <path id="LA" data-name="Laos" data-flag="🇱🇦" data-symbol="₭ (Kip)" class="country-path" style="fill: var(--color-laos);" d="M 200 115 L 250 130 L 290 200 L 270 230 L 240 210 L 225 140 Z" onclick="launchGame('LA')"/>
                    
                    <path id="TH" data-name="Thailand" data-flag="🇹🇭" data-symbol="฿ (Baht)" class="country-path" style="fill: var(--color-thailand);" d="M 195 185 L 235 215 L 250 215 L 265 260 L 220 270 L 215 320 L 200 350 L 195 310 L 210 245 Z" onclick="launchGame('TH')"/>
                    
                    <path id="KH" data-name="Cambodia" data-flag="🇰🇭" data-symbol="៛ (Riel)" class="country-path" style="fill: var(--color-cambodia);" d="M 240 275 L 285 270 L 295 315 L 245 325 Z" onclick="launchGame('KH')"/>
                    
                    <path id="VN" data-name="Vietnam" data-flag="🇻🇳" data-symbol="₫ (Dong)" class="country-path" style="fill: var(--color-vietnam);" d="M 255 125 L 280 140 L 300 200 L 315 260 L 300 320 L 290 315 L 280 265 L 245 210 Z" onclick="launchGame('VN')"/>
                    
                    <path id="MY" data-name="Malaysia" data-flag="🇲🇾" data-symbol="RM (Ringgit)" class="country-path" style="fill: var(--color-malaysia);" d="M 198 360 L 220 360 L 230 385 L 205 390 Z M 370 370 L 460 370 L 450 400 L 380 395 Z" onclick="launchGame('MY')"/>
                    
                    <circle id="SG" data-name="Singapore" data-flag="🇸🇬" data-symbol="$ (SGD)" class="country-path" style="fill: var(--color-singapore);" cx="231" cy="392" r="12" onclick="launchGame('SG')"/>
                    
                    <polygon id="BN" data-name="Brunei" data-flag="🇧🇳" data-symbol="$ (BND)" class="country-path" style="fill: var(--color-brunei);" points="405,372 415,372 412,380 403,378" onclick="launchGame('BN')"/>
                    
                    <path id="ID" data-name="Indonesia" data-flag="🇮🇩" data-symbol="Rp (Rupiah)" class="country-path" style="fill: var(--color-indonesia);" d="M 150 410 L 250 450 L 220 470 L 140 430 Z M 260 465 L 430 465 L 430 490 L 260 490 Z M 350 390 L 365 375 L 395 395 L 365 425 Z M 480 380 L 580 360 L 590 440 L 480 440 Z" onclick="launchGame('ID')"/>
                    
                    <path id="PH" data-name="Philippines" data-flag="🇵🇭" data-symbol="₱ (PHP)" class="country-path" style="fill: var(--color-philippines);" d="M 420 120 L 460 110 L 495 190 L 510 260 L 460 280 L 420 200 Z" onclick="launchGame('PH')"/>
                    
                    <path id="TL" data-name="Timor-Leste" data-flag="🇹🇱" data-symbol="$ (USD)" class="country-path" style="fill: var(--color-timor);" d="M 445 480 L 475 480 L 470 492 L 442 490 Z" onclick="launchGame('TL')"/>

                    <g font-size="11" font-weight="bold" fill="white" pointer-events="none" font-family="sans-serif">
                        <text x="125" y="110">MM</text>
                        <text x="230" y="150">LA</text>
                        <text x="210" y="240">TH</text>
                        <text x="248" y="305">KH</text>
                        <text x="275" y="170">VN</text>
                        <text x="170" y="378" fill="#1e293b">MY 🇲🇾</text>
                        <text x="248" y="396" fill="#1e293b">SG</text>
                        <text x="415" y="365" fill="#1e293b">BN</text>
                        <text x="320" y="480">INDONESIA</text>
                        <text x="445" y="190">PH</text>
                        <text x="480" y="495" fill="#1e293b">TL</text>
                    </g>
                </svg>
            </div>
        </div>

        <div class="panel">
            <h2>Flight Mission Control</h2>
            <div id="game-workspace" class="workspace">
                <div id="start-view">
                    <p style="font-size: 45px; margin: 0;">✈️</p>
                    <p style="color: #64748b; font-weight: 500;">Click on any colorful country on the map to unlock its currency challenges!</p>
                </div>
                
                <div id="quiz-stage" class="hidden"></div>
                <div id="currency-profile-page" class="hidden"></div>
            </div>
        </div>

    </div>

    <script>
        // Currency Database representing all 11 target modules for learning
        const currencyData = {
            'MM': { name: "Myanmar", flag: "🇲🇲", symbol: "K", currencyName: "Myanmar Kyat (MMK)", notes: [{val:"1,000K", color:"#b45309"}, {val:"5,000K", color:"#6b7280"}], coins: ["50K", "100K"], features: "Kyat banknotes showcase stylized fine patterns alongside dancing traditional lions (Chinthe) to protect the country's wealth values." },
            'LA': { name: "Laos", flag: "🇱🇦", symbol: "₭", currencyName: "Lao Kip (LAK)", notes: [{val:"10,000₭", color:"#0284c7"}, {val:"20,000₭", color:"#b91c1c"}], coins: ["No Coins Currently Used"], features: "Lao Kip bills emphasize local construction monuments alongside the image of President Kaysone Phomvihane." },
            'TH': { name: "Thailand", flag: "🇹🇭", symbol: "฿", currencyName: "Thai Baht (THB)", notes: [{val:"20฿", color:"#16a34a"}, {val:"50฿", color:"#2563eb"}, {val:"100฿", color:"#dc2626"}], coins: ["1฿", "2฿", "5฿", "10฿"], features: "Thai Baht banknotes feature a portrait of the King. They include a dynamic 3D holographic security thread that shifts color when tilted." },
            'KH': { name: "Cambodia", flag: "🇰🇭", symbol: "៛", currencyName: "Cambodian Riel (KHR)", notes: [{val:"1,000៛", color:"#7c3aed"}, {val:"5,000៛", color:"#0891b2"}], coins: ["No Coins Used"], features: "Cambodian notes display historical temples such as the famous Angkor Wat." },
            'VN': { name: "Vietnam", flag: "🇻🇳", symbol: "₫", currencyName: "Vietnamese Dong (VND)", notes: [{val:"10k₫", color:"#ea580c"}, {val:"20k₫", color:"#2563eb"}], coins: ["No Coins Used"], features: "Vietnamese Dong notes are printed on durable polymer plastics and proudly feature Uncle Ho Chi Minh on the front faces." },
            'MY': { name: "Malaysia", flag: "🇲🇾", symbol: "RM", currencyName: "Malaysian Ringgit (MYR)", notes: [{val:"RM1", color:"#2563eb"}, {val:"RM5", color:"#16a34a"}, {val:"RM10", color:"#dc2626"}], coins: ["5¢", "10¢", "20¢", "50¢"], features: "Ringgit bills carry the national Bunga Raya (Hibiscus flower) across all values alongside the first Prime Minister." },
            'SG': { name: "Singapore", flag: "🇸🇬", symbol: "$", currencyName: "Singapore Dollar (SGD)", notes: [{val:"$2", color:"#db2777"}, {val:"$5", color:"#0d9488"}, {val:"$10", color:"#ea580c"}], coins: ["5¢", "10¢", "20¢", "50¢", "$1"], features: "Singapore Dollars use clean polymer builds showcasing educational theme symbols on back designs." },
            'BN': { name: "Brunei", flag: "🇧🇳", symbol: "$", currencyName: "Brunei Dollar (BND)", notes: [{val:"$1", color:"#15803d"}, {val:"$5", color:"#b45309"}], coins: ["5¢", "10¢", "20¢", "50¢"], features: "Brunei Dollars match Singapore rates exactly! They show Sultan Hassanal Bolkiah dressed in ceremonial wear." },
            'ID': { name: "Indonesia", flag: "🇮🇩", symbol: "Rp", currencyName: "Indonesian Rupiah (IDR)", notes: [{val:"2k", color:"#6b7280"}, {val:"5k", color:"#059669"}, {val:"10k", color:"#7c3aed"}], coins: ["Rp100", "Rp200", "Rp500"], features: "Rupiah bills carry intricate traditional batik patterns mixed within high-visibility color choices." },
            'PH': { name: "Philippines", flag: "🇵🇭", symbol: "₱", currencyName: "Philippine Peso (PHP)", notes: [{val:"20₱", color:"#ea580c"}, {val:"50₱", color:"#2563eb"}], coins: ["1₱", "5₱", "10₱"], features: "Philippine banknotes highlight unique native animals on the reverse, like the tiny Philippine Tarsier." },
            'TL': { name: "Timor-Leste", flag: "🇹🇱", symbol: "$", currencyName: "United States Dollar (USD)", notes: [{val:"$1", color:"#16a34a"}, {val:"$5", color:"#9a3412"}], coins: ["1c", "5c", "10c", "25c"], features: "Timor-Leste uses regular United States Dollar paper notes for big trades, but mints their own custom Centavo metal coins for change!" }
        };

        let activeTargetValue = 0;
        let selectedCode = "";

        // --- TOOLTIP DIALOGUE BOX MOUSE ENGINE ---
        const tooltip = document.getElementById('tooltip');
        const mapFrame = document.getElementById('map-frame');

        document.querySelectorAll('.country-path').forEach(path => {
            path.addEventListener('mousemove', function(e) {
                const id = this.getAttribute('id');
                const data = currencyData[id] || { name: this.getAttribute('data-name'), flag: this.getAttribute('data-flag'), symbol: this.getAttribute('data-symbol') };
                
                tooltip.style.display = 'block';
                tooltip.innerHTML = `${data.flag} ${data.name} <br> <span style='color:#facc15;'>Currency: ${data.symbol}</span>`;
                
                const bounds = mapFrame.getBoundingClientRect();
                tooltip.style.left = (e.clientX - bounds.left - tooltip.offsetWidth / 2) + 'px';
                tooltip.style.top = (e.clientY - bounds.top - tooltip.offsetHeight - 12) + 'px';
            });

            path.addEventListener('mouseleave', () => tooltip.style.display = 'none');
        });

        // --- GAME SYSTEM LAUNCH CONTROLLER ---
        function launchGame(code) {
            selectedCode = code;
            document.querySelectorAll('.country-path').forEach(el => el.classList.remove('active'));
            document.getElementById(code).classList.add('active');
            
            document.getElementById('start-view').classList.add('hidden');
            document.getElementById('currency-profile-page').classList.add('hidden');
            
            const quizStage = document.getElementById('quiz-stage');
            quizStage.classList.remove('hidden');
            document.getElementById('game-workspace').className = "panel workspace active-game";

            const data = currencyData[code];
            const statusBoard = document.getElementById('flight-status');
            statusBoard.innerHTML = `✈️ ARRIVED AT FLIGHT HUB: ${data.name.toUpperCase()} (${code})`;

            // Generate an adaptive simple task tailored for a Year 3 level
            const valMultiplier = Math.floor(Math.random() * 4) + 3; // 3 to 6
            activeTargetValue = valMultiplier * 5;

            quizStage.innerHTML = `
                <h3 style="color:var(--primary-blue); margin:0;">${data.flag} Destination Terminal Challenge</h3>
                <p>Welcome to ${data.name}! Let's try out a currency calculation before checking out the market stalls.</p>
                <hr style="border: 0; border-top: 1px solid #e2e8f0; margin:12px 0;">
                <p>If a box of fresh local juice costs exactly <strong>5 ${data.symbol} units</strong>, how much change total do you need to pay for <strong>${valMultiplier} boxes</strong> combined together?</p>
                <div class="input-group">
                    <input type="number" id="math-input" placeholder="?"> <strong>${data.symbol}</strong>
                    <button class="btn" onclick="verifyAnswer()">Verify Ticket</button>
                </div>
                <div id="game-feedback"></div>
            `;
        }

        function verifyAnswer() {
            const userInput = parseInt(document.getElementById('math-input').value);
            const feedback = document.getElementById('game-feedback');

            if (userInput
