<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASEAN Currency Flight Academy</title>
    <style>
        :root {
            --primary-blue: #003366;
            --accent-red: #be123c;
            --ocean-blue: #e0f2fe;
            --land-green: #22c55e;
            --hover-gold: #eab308;
            --dark-slate: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            background-color: var(--primary-blue);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 950px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .airport-status {
            background-color: #111;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 20px;
            width: 100%;
            max-width: 950px;
        }

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .panel h2 {
            margin-top: 0;
            color: var(--primary-blue);
            font-size: 1.3rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        /* Map Settings */
        .map-container {
            background-color: var(--ocean-blue);
            border: 2px solid #bae6fd;
            border-radius: 8px;
            padding: 10px;
            position: relative;
            min-height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: auto;
            max-height: 380px;
        }

        .country-path {
            fill: var(--land-green);
            stroke: #ffffff;
            stroke-width: 1.5;
            cursor: pointer;
            transition: fill 0.2s;
        }

        .country-path:hover {
            fill: var(--hover-gold);
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));
        }

        .country-path.active {
            fill: var(--accent-red) !important;
        }

        /* Dialogue Tooltip */
        .map-tooltip {
            position: absolute;
            background: rgba(30, 41, 59, 0.95);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 10;
            font-weight: bold;
            white-space: nowrap;
        }

        .map-tooltip::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: rgba(30, 41, 59, 0.95) transparent;
            display: block;
        }

        /* Workspace Panels */
        .workspace {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 20px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .workspace.active-game {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            display: block;
            text-align: left;
        }

        /* --- NEW: INTERACTIVE PHYSICAL MONEY DESIGN STYLES --- */
        .cash-flex-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 10px 0 20px 0;
        }

        /* Base styles for money container interaction */
        .cash-item {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            cursor: pointer;
            user-select: none;
            
            /* 1. HOVER ZOOM EFFECT RULE */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
        }

        .cash-item:hover {
            transform: scale(1.15); /* Zooms into view slightly */
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
            z-index: 5;
        }

        /* 2. CLICK ROTATE ANIMATION EFFECT RULE */
        .cash-item.spin-animation {
            transform: scale(1.15) rotateY(360deg);
        }

        /* Styling for visual stylized paper notes */
        .paper-note {
            width: 90px;
            height: 50px;
            border-radius: 4px;
            color: white;
            border: 2px dashed rgba(255,255,255,0.4);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
        }

        /* Styling for visual stylized shiny metal coins */
        .metal-coin {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            color: #854d0e;
            border: 2px solid #facc15;
            box-shadow: inset 0 0 4px rgba(255,255,255,0.6), 0 3px 5px rgba(0,0,0,0.2);
        }

        /* Form elements setup */
        .input-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="number"] {
            width: 80px;
            padding: 10px;
            font-size: 18px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            text-align: center;
        }

        .btn {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-blue { background-color: #0284c7; }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
            padding: 10px;
            border-radius: 6px;
        }
        .success { background-color: #d1fae5; color: #065f46; }
        .error { background-color: #fee2e2; color: #991b1b; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>🌏 ASEAN Currency Flight Academy</h1>
        <div class="airport-status" id="flight-status">
            📍 LOCATION: KLIA, MALAYSIA // STATUS: HOVER OVER MAP COUNTRIES OR CLICK A TARGET DESTINATION
        </div>
    </header>

    <div class="main-layout">
        
        <!-- INTERACTIVE MAP PANEL -->
        <div class="panel">
            <h2>Interactive ASEAN Destination Map</h2>
            <div class="map-container" id="map-frame">
                
                <div id="tooltip" class="map-tooltip"></div>

                <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
                    <text x="50" y="400" fill="#7dd3fc" font-size="12" font-family="monospace">INDIAN OCEAN</text>
                    <text x="600" y="150" fill="#7dd3fc" font-size="12" font-family="monospace">SOUTH CHINA SEA</text>

                    <!-- THAILAND -->
                    <path id="TH" data-name="Thailand" data-flag="🇹🇭" data-symbol="฿ (Baht)" class="country-path" d="M 280 200 L 320 200 L 330 250 L 310 270 L 300 320 L 290 320 L 290 260 L 260 230 Z" onclick="launchGame('TH')"/>
                    <text x="275" y="240" fill="white" font-weight="bold" font-size="12" pointer-events="none">THAI</text>

                    <!-- MALAYSIA -->
                    <path id="MY" data-name="Malaysia (Home)" data-flag="🇲🇾" data-symbol="RM (Ringgit)" class="country-path" style="fill: #64748b;" d="M 290 340 L 320 340 L 330 360 L 300 370 Z M 420 350 L 480 350 L 460 380 L 410 370 Z" onclick="alert('You are currently at the departure terminal gate in Malaysia!')"/>
                    <text x="275" y="385" fill="#475569" font-weight="bold" font-size="11" pointer-events="none">MALAYSIA</text>

                    <!-- SINGAPORE -->
                    <circle id="SG" data-name="Singapore" data-flag="🇸🇬" data-symbol="$ (SGD)" class="country-path" cx="332" cy="368" r="10" onclick="launchGame('SG')"/>
                    <text x="350" y="372" fill="#1e293b" font-weight="bold" font-size="11" pointer-events="none">SG 🇸🇬</text>

                    <!-- INDONESIA -->
                    <path id="ID" data-name="Indonesia" data-flag="🇮🇩" data-symbol="Rp (Rupiah)" class="country-path" d="M 260 390 L 340 420 L 320 430 L 250 400 Z M 350 425 L 450 425 L 450 440 L 350 440 Z M 480 370 L 530 360 L 540 400 L 490 410 Z" onclick="launchGame('ID')"/>
                    <text x="380" y="415" fill="white" font-weight="bold" font-size="12" pointer-events="none">INDONESIA</text>
                </svg>
            </div>
        </div>

        <!-- AIRPORT SHOP WORKSPACE -->
        <div class="panel">
            <h2>Flight Mission Control</h2>
            <div id="game-workspace" class="workspace">
                <div id="start-view">
                    <p style="font-size: 45px; margin: 0;">✈️</p>
                    <p style="color: #64748b; font-weight: 500;">Click on a country to open your custom currency mission!</p>
                </div>
                
                <div id="quiz-stage" class="hidden"></div>
                <div id="currency-profile-page" class="hidden"></div>
            </div>
        </div>

    </div>

    <script>
        // Data containing design colors and specific values for graphic processing
        const currencyData = {
            'TH': {
                name: "Thailand", flag: "🇹🇭", symbol: "฿", currencyName: "Thai Baht (THB)",
                notes: [
                    { val: "20฿", color: "#16a34a" }, // Green
                    { val: "50฿", color: "#2563eb" }, // Blue
                    { val: "100฿", color: "#dc2626" } // Red
                ],
                coins: ["1฿", "2฿", "5฿", "10฿"],
                features: "Thai Baht banknotes feature a portrait of the King. They include a dynamic 3D holographic security thread that shifts color when tilted in your hand!"
            },
            'SG': {
                name: "Singapore", flag: "🇸🇬", symbol: "$", currencyName: "Singapore Dollar (SGD)",
                notes: [
                    { val: "$2", color: "#db2777" },  // Purple/Pink
                    { val: "$5", color: "#0d9488" },  // Green
                    { val: "$10", color: "#ea580c" }  // Red/Orange
                ],
                coins: ["5¢", "10¢", "20¢", "50¢", "$1"],
                features: "Singapore Dollars are printed on smooth plastic polymer instead of paper! This makes them completely waterproof and extremely hard to tear."
            },
            'ID': {
                name: "Indonesia", flag: "🇮🇩", symbol: "Rp", currencyName: "Indonesian Rupiah (IDR)",
                notes: [
                    { val: "1k", color: "#cb5a1e" }, // Rp1,000 Yellow/Brown
                    { val: "2k", color: "#6b7280" }, // Rp2,000 Gray
                    { val: "5k", color: "#059669" }  // Rp5,000 Green
                ],
                coins: ["Rp100", "Rp200", "Rp500"],
                features: "Because calculations scale up quickly, Indonesian notes feature vibrant primary identity color blocks (like bright green or purple) to assist people with visual differences."
            }
        };

        let activeTargetValue = 0;
        let selectedCode = "";

        // --- TOOLTIP DIALOGUE LOGIC ---
        const tooltip = document.getElementById('tooltip');
        const mapFrame = document.getElementById('map-frame');

        document.querySelectorAll('.country-path').forEach(path => {
            path.addEventListener('mousemove', function(e) {
                const name = this.getAttribute('data-name');
                const flag = this.getAttribute('data-flag');
                const symbol = this.getAttribute('data-symbol');
                
                tooltip.style.display = 'block';
                tooltip.innerHTML = `${flag} ${name} <br> <span style='color:#eab308;'>Symbol: ${symbol}</span>`;
                
                const bounds = mapFrame.getBoundingClientRect();
                tooltip.style.left = (e.clientX - bounds.left - tooltip.offsetWidth / 2) + 'px';
                tooltip.style.top = (e.clientY - bounds.top - tooltip.offsetHeight - 12) + 'px';
            });

            path.addEventListener('mouseleave', () => tooltip.style.display = 'none');
        });

        // --- GAME LAUNCH LOGIC ---
        function launchGame(code) {
            selectedCode = code;
            document.querySelectorAll('.country-path').forEach(el => el.classList.remove('active'));
            document.getElementById(code).classList.add('active');
            
            document.getElementById('start-view').classList.add('hidden');
            document.getElementById('currency-profile-page').classList.add('hidden');
            
            const quizStage = document.getElementById('quiz-stage');
            quizStage.classList.remove('hidden');
            document.getElementById('game-workspace').className = "panel workspace active-game";

            const data = currencyData[code];

            if (code === 'TH') {
                const multiplier = Math.floor(Math.random() * 5) + 4; // 4 to 8
                activeTargetValue = multiplier;
                const cost = multiplier * 8;

                quizStage.innerHTML = `
                    <h3 style="color:var(--accent-red); margin:0;">${data.flag} Destination: ${data.name}</h3>
                    <p>A souvenir backpack costs <strong>${cost} Baht (${data.symbol})</strong>.</p>
                    <p style="background:#f1f5f9; padding:8px; border-radius:4px; font-size:14px;">
                        💡 <strong>Exchange Rate Rule:</strong> 1 Malaysian Ringgit (MYR) = <strong>8 Thai Baht</strong>
                    </p>
                    <p>Type in the blank: How many <strong>MYR notes</strong> equal exactly ${cost} Baht?</p>
                    <div class="input-group">
                        <input type="number" id="math-input" placeholder="?"> <strong>MYR</strong>
                        <button class="btn" onclick="verifyAnswer()">Check Answer</button>
                    </div>
                    <div id="game-feedback"></div>
                `;
            } else if (code === 'SG') {
                const itemCost = Math.floor(Math.random() * 5) + 12;
                activeTargetValue = 20 - itemCost;

                quizStage.innerHTML = `
                    <h3 style="color:#0284c7; margin:0;">${data.flag} Destination: ${data.name}</h3>
                    <p>Your airport snack bill comes to <strong>$${itemCost} SGD</strong>.</p>
                    <p>You give the cashier a crisp <strong>$20 SGD note</strong>.</p>
                    <p>Type in the blank: How much <strong>change ($)</strong> should you receive back?</p>
                    <div class="input-group">
                        <input type="number" id="math-input" placeholder="?"> <strong>SGD ($)</strong>
                        <button class="btn" onclick="verifyAnswer()">Check Answer</button>
                    </div>
                    <div id="game-feedback"></div>
                `;
            } else if (code === 'ID') {
                const valueA = 400;
                const valueB = 500;
                activeTargetValue = valueA + valueB;

                quizStage.innerHTML = `
                    <h3 style="color:#059669; margin:0;">${data.flag} Destination: ${data.name}</h3>
                    <p>You choose a postcard for <strong>Rp ${valueA}</strong> and a stamp for <strong>Rp ${valueB}</strong>.</p>
                    <p>Type in the blank: What is the <strong>total cost</strong> in Rupiah?</p>
                    <div class="input-group">
                        <input type="number" id="math-input" style="width:110px;" placeholder="?"> <strong>Rp</strong>
                        <button class="btn" onclick="verifyAnswer()">Check Answer</button>
                    </div>
                    <div id="game-feedback"></div>
                `;
            }
        }

        function verifyAnswer() {
            const userInput = parseInt(document.getElementById('math-input').value);
            const feedback = document.getElementById('game-feedback');

            if (isNaN(userInput)) {
                feedback.className = "feedback error";
                feedback.innerHTML = "Please type a number value inside the blank box first!";
                return;
            }

            if (userInput === activeTargetValue) {
                feedback.className = "feedback success";
                feedback.innerHTML = `🎉 Correct answer! Your flight passport has been stamped!`;
                feedback.innerHTML += `<br><br><button class="btn btn-blue" onclick="showCurrencyProfilePage()">Explore ${currencyData[selectedCode].currencyName} ➡️</button>`;
            } else {
                feedback.className = "feedback error";
                feedback.innerHTML = "❌ Not quite! Review your math work and try entering another number.";
            }
        }

        // --- NEW DETAILED INTERACTIVE CURRENCY EXPLORATION SCREEN ---
        function showCurrencyProfilePage() {
            document.getElementById('quiz-stage').classList.add('hidden');
            
            const profilePage = document.getElementById('currency-profile-page');
            profilePage.classList.remove('hidden');
            
            const data = currencyData[selectedCode];
            
            // Build the virtual stylized paper notes HTML structure dynamically
            let notesHtml = '';
            data.notes.forEach(note => {
                notesHtml += `
                    <div class="cash-item paper-note" style="background-color: ${note.color};" onclick="spinMoneyElement(this)">
                        ${note.val}
                    </div>`;
            });

            // Build the virtual stylized coins HTML structure dynamically
            let coinsHtml = '';
            data.coins.forEach(coin => {
                coinsHtml += `
                    <div class="cash-item metal-coin" onclick="spinMoneyElement(this)">
                        ${coin}
                    </div>`;
            });

            profilePage.innerHTML = `
                <h3 style="color: var(--primary-blue); margin-top:0;">📂 Currency Exploration Field</h3>
                <p style="font-size:13px; color:#64748b; margin: -5px 0 15px 0;">✨ <em>Hover your mouse to zoom into a denomination! Click it to flip/spin it!</em></p>
                
                <div style="text-align: left;">
                    <strong style="font-size: 14px; color:#475569;">💵 Paper Banknotes:</strong>
                    <div class="cash-flex-container">${notesHtml}</div>
                    
                    <strong style="font-size: 14px; color:#475569;">🪙 Metal Coins:</strong>
                    <div class="cash-flex-container">${coinsHtml}</div>
                </div>

                <div style="margin-top:15px; text-align:left;">
                    <strong>🎨 Key Cool Identification Features:</strong>
                    <p style="color: #475569; font-size:14px; line-height:1.5; background:#f8fafc; padding:10px; border-radius:6px; border-left:4px solid var(--primary-blue); margin-top:5px;">
                        ${data.features}
                    </p>
                </div>

                <button class="btn" style="background:#475569; margin-top:15px; width:100%;" onclick="resetWorkspace()">🔙 Return to Airport Departure Gate</button>
            `;
        }

        // --- NEW: HANDLE CLICK ROTATE LOGIC STATE ---
        function spinMoneyElement(element) {
            // Add the rotational class hook
            element.classList.add('spin-animation');
            
            // Remove the class hook after the transition completes (0.4 seconds) so students can click it multiple times
            setTimeout(() => {
                element.classList.remove('spin-animation');
            }, 400);
        }

        function resetWorkspace() {
            document.getElementById('currency-profile-page').classList.add('hidden');
            document.getElementById('start-view').classList.remove('hidden');
            document.getElementById('game-workspace').className = "panel workspace";
            document.querySelectorAll('.country-path').forEach(el => el.classList.remove('active'));
            document.getElementById('flight-status').innerHTML = "📍 LOCATION: KLIA, MALAYSIA // STATUS: HOVER OVER MAP COUNTRIES OR CLICK A TARGET DESTINATION";
        }
    </script>
</body>
</html>
